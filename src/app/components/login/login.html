<div class="video-background">
  <video autoplay muted loop playsinline>
    <!-- Update the src to point to your local video -->
    <source src="/teaser.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="video-overlay"></div>
</div>

<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue your journey</p>
    
    <div class="input-group">
      <i class="fas fa-user"></i>
      <input id="username" formControlName="username" placeholder="Enter username" />
    </div>

    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input id="password" type="password" formControlName="password" placeholder="Enter password" />
    </div>

    <button type="submit" [disabled]="isLoading" class="login-btn">
      <span *ngIf="!isLoading">Login</span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>

    <div class="alternatives">
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i>
      {{ errorMessage }}
    </div>
  </form>

  <div class="register-section">
    <p>Don't have an account?</p>
    <button class="register-btn" routerLink="/register">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
  </div>
</div>
